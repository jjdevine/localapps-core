[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localapps-core"
version = "0.2.0"
description = "The parts every small self-hosted FastAPI + SQLite app repeats: one-password login, .env secrets, database set-up, migrations at start-up, /health, backups, push notifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Only an app that sends push notifications (localapps_core.push) needs this one.
push = [
    "pywebpush>=2.0",
]
dev = [
    "pywebpush>=2.0",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["localapps_core*"]

[tool.setuptools.package-data]
localapps_core = ["py.typed", "static/push/*.js"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["localapps_core"]

[[tool.mypy.overrides]]
# pywebpush and py_vapid ship no type information.
module = ["pywebpush", "py_vapid", "py_vapid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
